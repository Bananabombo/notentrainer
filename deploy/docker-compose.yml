# Tonika auf dem Raspberry Pi: statischer nginx, nur lokal – öffentlich über den Cloudflare-Tunnel
services:
  tonika:
    image: nginx:alpine
    container_name: tonika
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:80"
    volumes:
      - ..:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options: { max-size: "5m", max-file: "2" }
