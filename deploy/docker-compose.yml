# Tonika auf dem Raspberry Pi: App + API (Login, Sync) + Notenerkennung – nur lokal, öffentlich über den Cloudflare-Tunnel
services:
  tonika:
    build: ../server
    image: tonika-server
    container_name: tonika
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:8000"
    env_file: .env                         # REGISTER_CODE=… (Einladungscode für neue Konten)
    environment:
      - TZ=Europe/Berlin
      - OMR_JAVA_OPTS=-Xmx2g
    volumes:
      - ..:/site:ro                        # die App selbst – Update per git pull, ohne Neustart
      - ${TONIKA_DATA:-/home/adrian/Tonika-data}:/data   # Konten, Fortschritt, Noten
    mem_limit: 3g
    logging:
      driver: "json-file"
      options: { max-size: "10m", max-file: "3" }
