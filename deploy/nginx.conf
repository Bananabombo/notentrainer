server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  location ~ /\.(git|github) { deny all; }
  location ^~ /deploy/ { deny all; }
  # Code immer frisch prüfen, damit Updates sofort ankommen
  location ~* \.(html|js|css|json|musicxml)$ { add_header Cache-Control "no-cache"; }
  location ~* \.(png|svg|woff2?)$ { add_header Cache-Control "public, max-age=604800"; }
  location / { try_files $uri $uri/ =404; }
}
